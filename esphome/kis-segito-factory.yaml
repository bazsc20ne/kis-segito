#
# Firmware built by CI for GitHub Releases and the web installer.
# It has no Wi-Fi credentials: set them through the knob's own access point
# (captive portal), then adopt the device in the Home Assistant ESPHome Builder.

packages:
  kis_segito: !include kis-segito.yaml

dashboard_import:
  package_import_url: github://bazsc20ne/kis-segito/esphome/kis-segito.yaml@main
  import_full_config: false
