# SPDX-License-Identifier: AGPL-3.0-only
#
# Firmware built by CI for GitHub Releases and the web installer.
# It has no Wi-Fi credentials: set them through the knob's own access point
# (captive portal), then adopt the device in the Home Assistant ESPHome Builder.

substitutions:
  # Build the UI component and images from this checkout, not from a release.
  kis_segito_components: components
  kis_segito_assets: ../assets/device

packages:
  kis_segito: !include kis-segito.yaml

dashboard_import:
  package_import_url: github://bazsc20ne/kis-segito/esphome/kis-segito.yaml@v0.7.23
  import_full_config: false
