# SPDX-License-Identifier: AGPL-3.0-only
#
# Board definition for the VIEWE UEDX48480021-MD80E knob (no touch):
# ESP32-S3 + 2.1" 480x480 RGB panel, backlight. Included by kis-segito.yaml and
# display-test.yaml.
#
# Panel setup follows the vendor's MD80E ESP-IDF example
# (VIEWESMART/UEDX48480021-MD80ESP32_2.1inch-Knob,
# examples/ESP-IDF/UEDX48480021-MD80E-SDK, MIT - see NOTICE): timings from
# esp-bsp.h, the GC9503CV init table from bsp_lcd.c (panel/gc9503.yaml) and
# the vendor's way of sending it, which is what the factory demo firmware runs.
# Every timing value is a substitution, so a panel batch can be tuned from the
# device config without changing this file.

substitutions:
  # Panel controller init table: gc9503 (MD80E panel per its datasheet and the
  # factory demo) or st7701 (the vendor example's active table). See panel/.
  display_controller: gc9503
  # Diagnostic: "true" sends INVON (0x21) after the init table. If the colours
  # on screen invert, the init reaches the panel.
  display_init_test_invert: "false"
  display_pclk_frequency: 26MHz
  display_pclk_inverted: "false"
  display_hsync_pulse_width: "8"
  display_hsync_back_porch: "20"
  display_hsync_front_porch: "40"
  display_vsync_pulse_width: "8"
  display_vsync_back_porch: "20"
  display_vsync_front_porch: "50"

packages:
  panel: !include panel/${display_controller}.yaml

esphome:
  on_boot:
    # Panel init, done like the vendor's bsp_lcd.c: bit-banged 9-bit 3-wire SPI
    # (CS/SCK/SDA idle high, data changes while SCK is low, ~50 kHz), no reset
    # pulse, then SCK/SDA (shared with RGB data B6/B5) are released before the
    # RGB driver starts. Priority 700 runs this before the display (600).
    - priority: 700
      then:
        - lambda: |-
            const gpio_num_t cs = GPIO_NUM_18, sck = GPIO_NUM_13, sda = GPIO_NUM_12, rst = GPIO_NUM_8;
            gpio_config_t io{};
            io.mode = GPIO_MODE_OUTPUT;
            io.pin_bit_mask = (1ULL << cs) | (1ULL << sck) | (1ULL << sda) | (1ULL << rst);
            gpio_config(&io);
            gpio_set_level(rst, 1);
            gpio_set_level(cs, 1);
            gpio_set_level(sck, 1);
            gpio_set_level(sda, 1);

            auto write9 = [&](uint16_t word) {
              gpio_set_level(cs, 0);
              delayMicroseconds(10);
              for (int bit = 8; bit >= 0; bit--) {
                gpio_set_level(sda, (word >> bit) & 1);
                gpio_set_level(sck, 0);
                delayMicroseconds(10);
                gpio_set_level(sck, 1);
                delayMicroseconds(10);
              }
              delayMicroseconds(10);
              gpio_set_level(cs, 1);
              gpio_set_level(sck, 1);
              gpio_set_level(sda, 1);
              delayMicroseconds(10);
            };
            auto command = [&](uint8_t cmd) { write9(cmd); };
            auto data = [&](uint8_t value) { write9(0x100 | value); };

            const auto &table = id(panel_init_table);
            size_t i = 0, count = 0;
            while (i + 1 < table.size()) {
              uint8_t cmd = table[i], len = table[i + 1];
              i += 2;
              if (i + len > table.size()) {
                ESP_LOGE("kis_segito", "Malformed panel init table");
                break;
              }
              command(cmd);
              for (uint8_t n = 0; n < len; n++)
                data(table[i + n]);
              i += len;
              count++;
            }
            if (${display_init_test_invert}) {
              command(0x21);  // INVON, diagnostic only
            }
            delay(120);
            command(0x29);  // DISPON
            delay(20);
            gpio_reset_pin(sck);
            gpio_reset_pin(sda);
            ESP_LOGI("kis_segito", "Panel init (${display_controller}): %u commands sent",
                     (unsigned) count);

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      # As in the vendor example: run code/rodata from PSRAM and use 64-byte
      # cache lines, so flash access does not starve the RGB panel DMA.
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y

psram:
  mode: octal
  speed: 80MHz

display:
  - platform: mipi_rgb
    id: knob_display
    # "RPI" is ESPHome's generic RGB model without an init sequence and without
    # SPI: the panel is already initialised by the on_boot code above, so the
    # driver only sets up the RGB bus.
    model: RPI
    dimensions:
      width: 480
      height: 480
    de_pin: GPIO17
    pclk_pin: GPIO9
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    data_pins:
      red: [GPIO40, GPIO41, GPIO42, GPIO2, GPIO1]
      green: [GPIO21, GPIO47, GPIO48, GPIO45, GPIO38, GPIO39]
      blue: [GPIO10, GPIO11, GPIO12, GPIO13, GPIO14]
    pclk_frequency: ${display_pclk_frequency}
    pclk_inverted: ${display_pclk_inverted}
    hsync_pulse_width: ${display_hsync_pulse_width}
    hsync_back_porch: ${display_hsync_back_porch}
    hsync_front_porch: ${display_hsync_front_porch}
    vsync_pulse_width: ${display_vsync_pulse_width}
    vsync_back_porch: ${display_vsync_back_porch}
    vsync_front_porch: ${display_vsync_front_porch}
    update_interval: never
    auto_clear_enabled: false

# Backlight: P-channel MOSFET, GPIO7 low = on.
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO7
    inverted: true
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    icon: mdi:brightness-6
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms
