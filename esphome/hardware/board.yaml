# SPDX-License-Identifier: AGPL-3.0-only
#
# Board profile of the VIEWE UEDX48480021-MD80E knob (no touch): ESP32-S3,
# 2.1" 480x480 RGB panel, backlight, rotary encoder and push button. Included by
# kis-segito.yaml, display-test.yaml and pin-probe.yaml; docs/boards.md describes
# what a board profile provides.
#
# Panel setup follows the vendor's MD80E ESP-IDF example
# (VIEWESMART/UEDX48480021-MD80ESP32_2.1inch-Knob,
# examples/ESP-IDF/UEDX48480021-MD80E-SDK, MIT - see NOTICE): timings from
# esp-bsp.h and the GC9503CV init sequence from bsp_lcd.c (panel/gc9503.yaml),
# sent in the same order as the factory demo firmware.
# Every timing value is a substitution, so a panel batch can be tuned from the
# device config without changing this file.

substitutions:
  # The round display is 480x480 pixels.
  screen_size: "480"
  # Panel controller init sequence: gc9503 (MD80E panel per its datasheet and
  # the factory demo) or st7701 (the vendor example's active table).
  display_controller: gc9503
  # "y": firmware code and rodata run from PSRAM (default, as in the vendor
  # example). "n": they run from flash, leaving more PSRAM free (experimental).
  psram_xip: "y"
  # 16 MHz: at higher clocks this panel shows short bright lines on the left
  # half of the picture (stepped edges on the time track).
  display_pclk_frequency: 16MHz
  display_pclk_inverted: "false"
  display_hsync_pulse_width: "8"
  display_hsync_back_porch: "20"
  display_hsync_front_porch: "40"
  display_vsync_pulse_width: "8"
  display_vsync_back_porch: "20"
  display_vsync_front_porch: "50"
  # COLMOD sent after the init table: 0 = none (as the factory demo; the panel
  # keeps its 24-bit power-on mode, matching the board wiring), or 0x55 (16-bit),
  # 0x66 (18-bit), 0x77 (24-bit).
  display_colmod: "0"
  # Drive strength of the RGB bus pins (data, PCLK, HSYNC, VSYNC, DE): -1 keeps
  # the ESP-IDF default, 0..3 = ~5/10/20/40 mA. Lower values reduce crosstalk.
  display_drive_strength: "-1"
  # "n" (default): the RGB transfer restarts at a vertical sync whenever the
  # panel missed data in the previous frame, and after every main loop pass
  # (the display component asks for it), so a shifted picture is put right
  # within a frame or two. "y" restarts at every vertical sync, but with
  # ESP-IDF 5.5 a frame that missed data can then leave the picture striped
  # and stepped until the knob restarts.
  display_restart_in_vsync: "n"
  # Serial log: UART0 sends it on GPIO43/44 (the debug board's TX1/RX1).
  # UART1 has no pins assigned, which frees GPIO43/44 for sensors; the log
  # stays available over the network. Do not set logger_baud_rate to "0" on
  # this knob: the display then shows stripes and goes blank.
  logger_uart: UART0
  logger_baud_rate: "115200"
  # Encoder counts per mechanical click at the finest resolution (4 counts per
  # quadrature cycle). The MD80E encoder makes half a cycle per click = 2.
  # How many clicks make one UI step is set at runtime from Home Assistant
  # ("Encoder clicks per step").
  encoder_counts_per_click: "2"
  # Backlight PWM frequency. Its switching can disturb long sensor wires (see
  # docs/sensors.md, "I2C warnings"); try e.g. 300Hz or 20kHz if it does.
  backlight_pwm_frequency: 1000Hz

packages:
  panel: !include panel/${display_controller}.yaml

esphome:
  on_boot:
    # Initialise the panel the way the factory demo does: reset, the init
    # table, optional COLMOD, 120 ms, DISPON, 20 ms. ESPHome's own sequence
    # would always add COLMOD/MADCTL/INVOFF, and the panel needs no COLMOD.
    # The 3-wire SPI shares SCK/SDA with RGB data lines B6/B5, so the sequence
    # must reach the panel before the display takes those pins over for the
    # RGB bus: this step sends it itself (9-bit words, bit-banged) at priority
    # 700, before the display is set up (600), and gives the display an empty
    # sequence. The display has no reset pin, so it does not undo this.
    - priority: 700
      then:
        - lambda: |-
            static constexpr uint8_t DELAY = 0xFF;  // delay marker: {ms, DELAY}
            static constexpr uint8_t SLEEP_OUT = 0x11;
            const auto &table = id(panel_init_table);
            std::vector<uint8_t> seq(table.begin(), table.end());
            const int colmod = ${display_colmod};
            if (colmod != 0) {
              seq.insert(seq.end(), {0x3A, 1, static_cast<uint8_t>(colmod)});
            }
            seq.insert(seq.end(), {120, DELAY, 0x29, 0, 20, DELAY});

            constexpr gpio_num_t CS = GPIO_NUM_18, SCK = GPIO_NUM_13, SDA = GPIO_NUM_12, RST = GPIO_NUM_8;
            for (gpio_num_t pin : {CS, SCK, SDA, RST}) {
              gpio_reset_pin(pin);
              gpio_set_direction(pin, GPIO_MODE_OUTPUT);
            }
            gpio_set_level(CS, 1);
            gpio_set_level(SCK, 0);
            gpio_set_level(SDA, 0);
            // Reset pulse, as the display component did before.
            gpio_set_level(RST, 1);
            delay(5);
            gpio_set_level(RST, 0);
            delay(5);
            gpio_set_level(RST, 1);
            delay(120);
            // One 9-bit word, MSB first (first bit: 0 = command, 1 = data),
            // SPI mode 0, chip select around each word.
            auto send = [&](uint16_t word) {
              gpio_set_level(CS, 0);
              for (int bit = 8; bit >= 0; bit--) {
                gpio_set_level(SDA, (word >> bit) & 1);
                delayMicroseconds(1);
                gpio_set_level(SCK, 1);
                delayMicroseconds(1);
                gpio_set_level(SCK, 0);
              }
              gpio_set_level(CS, 1);
              delayMicroseconds(1);
            };
            size_t i = 0, commands = 0;
            while (i + 2 <= seq.size()) {
              const uint8_t cmd = seq[i++], x = seq[i++];
              if (x == DELAY) {
                delay(cmd);
                continue;
              }
              const size_t n = x & 0x7F;
              if (i + n > seq.size())
                break;  // malformed table: stop, never read past it
              if (cmd == SLEEP_OUT)
                delay(120);
              send(cmd);
              for (size_t k = 0; k < n; k++)
                send(0x100 | seq[i + k]);
              i += n;
              commands++;
              if (cmd == SLEEP_OUT)
                delay(10);
            }
            gpio_set_level(SDA, 0);
            static const uint8_t EMPTY[1] = {0};
            id(knob_display)->set_init_sequence(EMPTY, 0);
            ESP_LOGI("kis_segito", "Panel init: ${display_controller}, %u commands, COLMOD %s",
                     (unsigned) commands, colmod != 0 ? str_snprintf("0x%02X", 8, colmod).c_str() : "none");
    # Optional RGB bus drive strength, applied right after the display has
    # created the RGB panel (priority 590 runs after the display's 600).
    - priority: 590
      then:
        - lambda: |-
            const int drive = ${display_drive_strength};
            if (drive < 0 || drive > 3)
              return;
            static const gpio_num_t pins[] = {
                GPIO_NUM_40, GPIO_NUM_41, GPIO_NUM_42, GPIO_NUM_2,  GPIO_NUM_1,  GPIO_NUM_21, GPIO_NUM_47,
                GPIO_NUM_48, GPIO_NUM_45, GPIO_NUM_38, GPIO_NUM_39, GPIO_NUM_10, GPIO_NUM_11, GPIO_NUM_12,
                GPIO_NUM_13, GPIO_NUM_14, GPIO_NUM_9,  GPIO_NUM_46, GPIO_NUM_3,  GPIO_NUM_17};
            for (auto pin : pins)
              gpio_set_drive_capability(pin, static_cast<gpio_drive_cap_t>(drive));
            ESP_LOGI("kis_segito", "RGB bus drive strength set to level %d", drive);

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      # 64-byte cache lines: faster PSRAM access for the RGB panel's frame
      # buffer.
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      # Code and rodata run from PSRAM (as in the vendor example), so flash
      # access never stalls the RGB panel. "n" runs them from flash instead,
      # which frees several MB of PSRAM; experimental, see psram_xip.
      CONFIG_SPIRAM_XIP_FROM_PSRAM: ${psram_xip}
      # The unused end of the last PSRAM page holding rodata is not added to
      # the heap: for some firmware sizes ESP-IDF's heap cannot take that
      # small piece and the knob crashes at boot. At most 64 KB stay unused.
      CONFIG_SPIRAM_PRE_CONFIGURE_MEMORY_PROTECTION: n
      # See display_restart_in_vsync above.
      CONFIG_LCD_RGB_RESTART_IN_VSYNC: ${display_restart_in_vsync}
      # Keep ESP-IDF's secondary console off the native USB port: with it on,
      # the display stays blank whenever no USB host (PC) is connected, e.g.
      # on a USB charger (#8).
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: y

# The native USB port (USB-Serial-JTAG) is left unused at runtime (#8).
logger:
  hardware_uart: ${logger_uart}
  baud_rate: ${logger_baud_rate}

psram:
  mode: octal
  speed: 80MHz

# 3-wire SPI (9-bit) used only to send the init sequence. SCK/SDA share pins with
# RGB data lines B6/B5, so a software SPI bus is used; the RGB driver takes the
# pins over afterwards.
spi:
  id: lcd_spi
  interface: software
  clk_pin:
    number: GPIO13
    allow_other_uses: true
  mosi_pin:
    number: GPIO12
    allow_other_uses: true

display:
  - platform: mipi_rgb
    id: knob_display
    model: CUSTOM
    spi_id: lcd_spi
    dimensions:
      width: 480
      height: 480
    cs_pin: GPIO18
    # No reset_pin: the init step above resets the panel (GPIO8) itself, and
    # a reset by the display would undo the init sequence.
    de_pin: GPIO17
    pclk_pin: GPIO9
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    data_pins:
      red: [GPIO40, GPIO41, GPIO42, GPIO2, GPIO1]
      green: [GPIO21, GPIO47, GPIO48, GPIO45, GPIO38, GPIO39]
      blue:
        - GPIO10
        - GPIO11
        - number: GPIO12
          allow_other_uses: true
        - number: GPIO13
          allow_other_uses: true
        - GPIO14
    pclk_frequency: ${display_pclk_frequency}
    pclk_inverted: ${display_pclk_inverted}
    hsync_pulse_width: ${display_hsync_pulse_width}
    hsync_back_porch: ${display_hsync_back_porch}
    hsync_front_porch: ${display_hsync_front_porch}
    vsync_pulse_width: ${display_vsync_pulse_width}
    vsync_back_porch: ${display_vsync_back_porch}
    vsync_front_porch: ${display_vsync_front_porch}
    update_interval: never
    auto_clear_enabled: false
    # Placeholder only (NOP): the real sequence is set by the on_boot step
    # above from panel/${display_controller}.yaml.
    init_sequence:
      - [0x00]

# Backlight: P-channel MOSFET, GPIO7 low = on.
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO7
    inverted: true
    frequency: ${backlight_pwm_frequency}

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    icon: mdi:brightness-6
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# Rotary encoder: external 4.7k pull-ups are on the board. A/B are swapped
# against the vendor's BSP_ENCODER_A/B so that clockwise counts up.
sensor:
  - platform: rotary_encoder
    id: knob_encoder
    name: Encoder
    icon: mdi:knob
    pin_a: GPIO5
    pin_b: GPIO6
    # Finest resolution; clicks are counted in software.
    resolution: 4
    # Raw counts are only useful for debugging.
    internal: true

# Push button: GPIO0 is a strapping pin. Holding the button down while the knob
# powers up or restarts puts the ESP32-S3 into download (flashing) mode.
# External pull-up on the board.
binary_sensor:
  - platform: gpio
    id: knob_button
    name: Button
    icon: mdi:gesture-tap-button
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
