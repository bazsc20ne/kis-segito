# SPDX-License-Identifier: AGPL-3.0-only
#
# CI only: an own build from the parts (board, input, core) without the
# built-in sensors, with other sensors as in docs/sensors.md (a PIR on GPIO4
# and a BH1750 light sensor), to prove such a config builds. Not meant to be
# flashed as is.

substitutions:
  name: kis-segito
  friendly_name: Kis Segito
  kis_segito_components: components
  kis_segito_assets: ../assets/device
  logger_uart: UART1

packages:
  board: !include ../hardware/board.yaml
  input: !include ../inputs/encoder-button.yaml
  core: !include ../kis-segito-core.yaml

i2c:
  sda: GPIO43
  scl: GPIO44
  frequency: 100kHz

binary_sensor:
  - platform: gpio
    name: Motion
    device_class: motion
    pin: GPIO4
    on_state:
      - binary_sensor.template.publish:
          id: ks_presence
          state: !lambda return x;

sensor:
  - platform: bh1750
    name: Room light
    update_interval: 10s
    on_value:
      - sensor.template.publish:
          id: ks_illuminance
          state: !lambda return x;
