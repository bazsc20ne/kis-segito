#
# Example device config for the Kis Segito knob. Copy it into the ESPHome Builder
# (or your ESPHome config folder), adjust the name and keep secrets in secrets.yaml.

substitutions:
  name: kis-segito
  friendly_name: Kis Segito

packages:
  kis_segito: github://bazsc20ne/kis-segito/esphome/kis-segito.yaml@v0.7.6

# One encryption key per knob (generate one at https://esphome.io/components/api/).
api:
  encryption:
    key: !secret kis_segito_api_key

ota:
  - id: !extend kis_segito_ota
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The fallback access point opens only when the knob cannot join Wi-Fi.
  ap:
    password: !secret ap_password
