# SPDX-License-Identifier: AGPL-3.0-only
#
# Kis Segito - core package (the knob's software without the hardware).
#
# kis-segito.yaml combines this core with the board profile of the VIEWE
# UEDX48480021-MD80E knob. For another knob, include this core next to your own
# board profile (see docs/boards.md):
#
#   packages:
#     kis_segito: github://bazsc20ne/kis-segito/esphome/kis-segito-core.yaml@v0.8.0
#     board: !include my-board.yaml
#
# The board profile provides these IDs: knob_display (the display, 480x480),
# backlight (a light), knob_encoder (a rotary_encoder sensor), knob_button (a
# binary_sensor, pressed = on), and the substitution encoder_counts_per_click.
# The core adds the knob's behaviour to them.
#
# The child UI is drawn by the kis_segito_ui external component (esphome/components)
# with the icons from assets/device. On-screen texts are not hard-coded: Home
# Assistant (the kis_segito integration) pushes them in the user's language through
# the `set_ui_strings` API action; the UI starts once they arrive.

substitutions:
  name: kis-segito
  friendly_name: Kis Segito
  # Where the UI component and its images come from. They must match the
  # version of this package; CI and local builds point them at the repository.
  kis_segito_components: github://bazsc20ne/kis-segito@v0.8.0
  kis_segito_assets: https://raw.githubusercontent.com/bazsc20ne/kis-segito/v0.8.0/assets/device
  # "true": log every raw encoder count (to check the encoder's detents).
  encoder_debug: "false"
  # Loading animation: highlight layer offset from the ball centre, in pixels
  # of the 48 px source image (negative = left / up). 0 keeps it where the
  # highlight image draws it.
  ball_highlight_dx: "0"
  ball_highlight_dy: "0"
  # LVGL draw buffer, as a share of the screen. With 100% each frame reaches
  # the panel in one piece (no visible cut while something moves); smaller
  # values save PSRAM (a full buffer is 450 KB) but draw in bands.
  lvgl_buffer_size: "100%"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  name_add_mac_suffix: false
  project:
    name: bazsc20ne.kis-segito
    version: "0.8.0"

external_components:
  - source: ${kis_segito_components}
    components: [kis_segito_ui]

packages:
  ui_images: !include ui-images.yaml

logger:

api:
  actions:
    # Sets on-screen strings. keys[i] gets values[i]; unknown keys are stored too,
    # so newer integration versions can add texts without a firmware change.
    - action: set_ui_strings
      variables:
        language: string
        keys: string[]
        values: string[]
      then:
        - lambda: |-
            auto &strings = id(ui_strings);
            for (size_t i = 0; i < keys.size() && i < values.size(); i++) {
              strings[keys[i]] = values[i];
            }
            id(ui_language) = std::string(language.c_str(), language.size());
            ESP_LOGI("kis_segito", "Received %u UI strings (%s)", (unsigned) keys.size(),
                     id(ui_language).c_str());
            // Keep the loading text in flash, so after a power cut the boot screen
            // already speaks the last known Home Assistant language.
            bool changed = false;
            auto it = strings.find("boot.loading");
            if (it != strings.end()) {
              std::array<char, 96> text{};
              size_t len = std::min(it->second.size(), text.size() - 1);
              // Do not cut a UTF-8 character in half.
              while (len > 0 && len < it->second.size() &&
                     (static_cast<uint8_t>(it->second[len]) & 0xC0) == 0x80) {
                len--;
              }
              memcpy(text.data(), it->second.data(), len);
              if (text != id(loading_text)) {
                id(loading_text) = text;
                changed = true;
              }
            }
            // The boot screen brand mark is Hungarian for "hu", English otherwise.
            const bool hu = id(ui_language) == "hu";
            if (hu != id(boot_language_hu)) {
              id(boot_language_hu) = hu;
              changed = true;
            }
            // Restored globals are normally written to flash only every minute;
            // write a language change soon so a quick restart keeps it.
            if (changed) {
              id(flush_preferences).execute();
            }
            id(ui).set_language(id(ui_language));
        - script.execute: refresh_texts
        - script.execute: stop_loading_anim
        - lambda: |-
            const auto mode = id(animation_mode).current_option();
            id(ui).set_animation_mode(std::string(mode.c_str(), mode.size()));
            id(ui).start();
    # Sensor inputs forwarded by Home Assistant (for a knob without its own
    # sensors): kind is "presence" (value 1 or 0), "distance" (cm, negative =
    # nobody) or "illuminance" (lx).
    - action: set_sensor
      variables:
        kind: string
        value: float
      then:
        - lambda: |-
            const std::string k(kind.c_str(), kind.size());
            if (k == "presence")
              id(ks_presence).publish_state(value > 0.5f);
            else if (k == "distance")
              id(ks_distance).publish_state(value < 0 ? NAN : value);
            else if (k == "illuminance")
              id(ks_illuminance).publish_state(value);
            else
              ESP_LOGW("kis_segito", "Unknown sensor input: %s", k.c_str());
    # Wakes the screen (soft fade-in), as a knob input would.
    - action: wake
      then:
        - lambda: |-
            id(wake_transition_ms) = 800;
            id(wake_screen).execute();
    # Starts (enable true) or ends (false) the screensaver.
    - action: screensaver
      variables:
        enable: bool
      then:
        - lambda: |-
            if (!id(ui).started())
              return;
            if (enable) {
              if (id(night_light_on) || (id(screen_state) & 1))
                return;
              id(screen_state) |= 1;
              id(start_screensaver).execute();
            } else {
              id(wake_screen).execute();
            }
    # Shows (enable true) or ends (false) the night light. brightness in
    # percent and kelvin (colour temperature); 0 uses the panel settings.
    - action: night_light
      variables:
        enable: bool
        brightness: int
        kelvin: int
      then:
        - lambda: |-
            if (!id(ui).started())
              return;
            if (enable) {
              const int pct = static_cast<int>(brightness), k = static_cast<int>(kelvin);
              id(night_req_brightness) = std::max(0, std::min(100, pct));
              id(night_req_kelvin) = k > 0 ? std::max(1500, std::min(6500, k)) : 0;
              id(night_light_start).execute();
            } else if (id(night_light_on)) {
              id(night_light_stop).execute();
            }
    # Data snapshot from Home Assistant (children, rewards, today's routines):
    # JSON, schema 1, see docs/protocol.md.
    - action: set_state
      variables:
        data: string
      then:
        - lambda: id(ui).set_state(std::string(data.c_str(), data.size()));

# Your device config sets the OTA password (see esphome/example.yaml):
#   ota:
#     - id: !extend kis_segito_ota
#       password: !secret ota_password
ota:
  - platform: esphome
    id: kis_segito_ota

# The fallback access point (with the captive portal) opens only when the knob
# cannot join Wi-Fi; it is the only way to change Wi-Fi without a cable. Its
# portal also accepts a firmware upload, so give it a password in your device
# config:  wifi: ap: password: !secret ap_password
wifi:
  ap: {}

captive_portal:

globals:
  # Encoder: raw count of the last committed step (a detent rest position),
  # the last raw count and when it changed (see knob_encoder).
  - id: encoder_base
    type: int
    initial_value: "0"
  - id: encoder_last_pos
    type: int
    initial_value: "0"
  - id: encoder_last_ms
    type: uint32_t
    initial_value: "0"
  # Encoder: direction of the last count (+1/-1) and the clicks counted since
  # the last UI step in that direction.
  - id: encoder_dir
    type: int
    initial_value: "0"
  - id: encoder_clicks
    type: int
    initial_value: "0"
  # The detent that wakes the screen is not a step.
  - id: encoder_swallow
    type: bool
    initial_value: "false"
  # A press that woke the screen does not also act as a click.
  - id: swallow_click
    type: bool
    initial_value: "false"
  # The current press already acted as a long press.
  - id: long_press_fired
    type: bool
    initial_value: "false"
  # Translated UI strings, filled by Home Assistant (key -> text).
  - id: ui_strings
    type: std::map<std::string, std::string>
  - id: ui_language
    type: std::string
    initial_value: '""'
  # LVGL timer of the loading-screen animation; deleted when content arrives.
  - id: loading_anim
    type: lv_timer_t *
    initial_value: nullptr
  # Boot screen text in the last language received from Home Assistant
  # (NUL-terminated UTF-8). Empty until the first connection.
  - id: loading_text
    type: std::array<char, 96>
    restore_value: true
  # Screen power: time of the last knob input, and the stages reached since
  # (bits: 1 screensaver, 2 dimmed, 4 drawing off, 8 backlight off; 0 = awake).
  - id: last_input_ms
    type: uint32_t
    initial_value: "0"
  - id: screen_state
    type: int
    initial_value: "0"
  # Black layer over everything while the backlight is off.
  - id: blank_overlay
    type: lv_obj_t *
    initial_value: nullptr
  # Backlight brightness before dimming, restored on wake-up.
  - id: awake_brightness
    type: float
    initial_value: "1.0"
  # Whether the last language received from Home Assistant was Hungarian; picks
  # the brand mark variant on the boot screen.
  - id: boot_language_hu
    type: bool
    initial_value: "false"
    restore_value: true
  # Transition of the next wake-up in ms (a presence wake-up fades in softly).
  - id: wake_transition_ms
    type: uint32_t
    initial_value: "200"
  # Sensors (see the presence, distance and illuminance inputs below): the
  # last time someone was near the knob, whether they are near now, the
  # previous presence and wake-up conditions (to act on changes only), and
  # whether the room is dark (night).
  - id: last_active_ms
    type: uint32_t
    initial_value: "0"
  - id: sensor_near
    type: bool
    initial_value: "false"
  - id: sensor_present_prev
    type: bool
    initial_value: "false"
  - id: sensor_wake_prev
    type: bool
    initial_value: "false"
  - id: is_night
    type: bool
    initial_value: "false"
  # Night light: shown now; when presence ended (0 = someone is there);
  # brightness and colour temperature asked by Home Assistant (0 = settings).
  - id: night_light_on
    type: bool
    initial_value: "false"
  - id: absent_since_ms
    type: uint32_t
    initial_value: "0"
  - id: night_req_brightness
    type: int
    initial_value: "0"
  - id: night_req_kelvin
    type: int
    initial_value: "0"
  # While set, switching the backlight off keeps the screen content (the night
  # light fades out before it is cleared).
  - id: keep_content
    type: bool
    initial_value: "false"
  # Backlight brightness from the room light (0..1; negative = not known yet).
  - id: ambient_level
    type: float
    initial_value: "-1.0"

script:
  # Writes changed restored globals to flash now instead of within a minute.
  # The delay lets the globals store their new values first.
  - id: flush_preferences
    mode: restart
    then:
      - delay: 500ms
      - lambda: global_preferences->sync();

  - id: stop_loading_anim
    then:
      - lambda: |-
          if (id(loading_anim) != nullptr) {
            lv_timer_delete(id(loading_anim));
            id(loading_anim) = nullptr;
          }

  # While the backlight is off the screen content is black and LVGL pauses.
  - id: blank_screen
    mode: restart
    then:
      - lambda: |-
          if (id(blank_overlay) == nullptr) {
            lv_obj_t *o = lv_obj_create(lv_layer_sys());
            lv_obj_remove_style_all(o);
            lv_obj_set_size(o, LV_PCT(100), LV_PCT(100));
            lv_obj_set_style_bg_color(o, lv_color_black(), 0);
            lv_obj_set_style_bg_opa(o, LV_OPA_COVER, 0);
            id(blank_overlay) = o;
          }
          lv_obj_remove_flag(id(blank_overlay), LV_OBJ_FLAG_HIDDEN);
      # Let one black frame render before pausing.
      - delay: 300ms
      - lvgl.pause:
  - id: unblank_screen
    mode: restart
    then:
      - script.stop: blank_screen
      - lvgl.resume:
      - lambda: |-
          if (id(blank_overlay) != nullptr)
            lv_obj_add_flag(id(blank_overlay), LV_OBJ_FLAG_HIDDEN);

  # The bouncing balls of the loading screen (also the screensaver).
  # Layered balls (recoloured base + highlight layer)
  # bounce off the round edge and off each other. On impact the base image is
  # briefly swapped for the dented ball, rotated so the dent faces the contact
  # point, then back to the round ball. The highlight never rotates or
  # deforms; its position is set by ball_highlight_dx/dy. A 30 ms LVGL timer
  # moves the balls.
  - id: start_balls
    then:
      - lambda: |-
          if (id(loading_anim) != nullptr)
            return;  // already running
          struct Ball {
            lv_obj_t *base;
            lv_obj_t *highlight;
            float x, y, vx, vy;  // centre and speed in px per tick
            int r;
            int dent;        // ticks left showing the dented image
            float nx, ny;    // direction of the last contact point
          };
          static Ball balls[] = {
              {id(ball_1), id(ball_1_hl), 240, 170, 4.6f, 2.1f, 22, 0, 0, 1},
              {id(ball_2), id(ball_2_hl), 190, 280, -3.2f, 3.9f, 18, 0, 0, 1},
              {id(ball_3), id(ball_3_hl), 300, 260, 2.4f, -4.4f, 15, 0, 0, 1},
              {id(ball_4), id(ball_4_hl), 250, 320, -4.1f, -2.7f, 20, 0, 0, 1},
              {id(ball_5), id(ball_5_hl), 160, 200, 3.7f, 3.3f, 17, 0, 0, 1},
          };
          static const lv_image_dsc_t *round_img = id(ks_img_ball_base_48)->get_lv_image_dsc();
          static const lv_image_dsc_t *dent_img = id(ks_img_ball_dent_48)->get_lv_image_dsc();
          constexpr int IMG = 48;  // source image size of all layers
          for (auto &b : balls) {
            const int scale = 2 * b.r * 256 / IMG;
            lv_image_set_scale(b.base, scale);
            lv_image_set_scale(b.highlight, scale);
          }
          id(loading_anim) = lv_timer_create(
              [](lv_timer_t *) {
                constexpr float CX = 240, CY = 240, EDGE = 234;
                constexpr int IMG = 48;
                constexpr int DENT_TICKS = 4;
                // Highlight offset from the ball centre, in source image pixels.
                constexpr float HL_DX = ${ball_highlight_dx}, HL_DY = ${ball_highlight_dy};
                constexpr size_t N = sizeof(balls) / sizeof(balls[0]);
                auto hit = [](Ball &b, float nx, float ny) {
                  b.dent = DENT_TICKS;
                  b.nx = nx;
                  b.ny = ny;
                };
                // Ball-to-ball bounces (elastic, mass ~ area).
                for (size_t i = 0; i < N; i++) {
                  for (size_t j = i + 1; j < N; j++) {
                    Ball &a = balls[i], &c = balls[j];
                    const float dx = c.x - a.x, dy = c.y - a.y;
                    const float dist = sqrtf(dx * dx + dy * dy);
                    const float min_dist = a.r + c.r;
                    if (dist >= min_dist || dist <= 0)
                      continue;
                    const float nx = dx / dist, ny = dy / dist;
                    const float rel = (a.vx - c.vx) * nx + (a.vy - c.vy) * ny;
                    if (rel > 0) {  // approaching each other
                      const float ma = a.r * a.r, mc = c.r * c.r;
                      const float imp = 2 * rel / (ma + mc);
                      a.vx -= imp * mc * nx;
                      a.vy -= imp * mc * ny;
                      c.vx += imp * ma * nx;
                      c.vy += imp * ma * ny;
                      hit(a, nx, ny);    // a touches c in direction n
                      hit(c, -nx, -ny);  // c touches a in direction -n
                    }
                    const float push = (min_dist - dist) / 2;  // separate them
                    a.x -= nx * push;
                    a.y -= ny * push;
                    c.x += nx * push;
                    c.y += ny * push;
                  }
                }
                for (auto &b : balls) {
                  b.x += b.vx;
                  b.y += b.vy;
                  const float dx = b.x - CX, dy = b.y - CY;
                  const float dist = sqrtf(dx * dx + dy * dy);
                  const float max_dist = EDGE - b.r;
                  if (dist > max_dist && dist > 0) {
                    const float nx = dx / dist, ny = dy / dist;
                    const float vn = b.vx * nx + b.vy * ny;
                    if (vn > 0) {  // moving outwards: reflect off the circle
                      b.vx -= 2 * vn * nx;
                      b.vy -= 2 * vn * ny;
                      hit(b, nx, ny);  // the wall is outwards
                    }
                    b.x = CX + nx * max_dist;
                    b.y = CY + ny * max_dist;
                  }
                  if (b.dent == DENT_TICKS) {
                    // The dent is drawn at the bottom (+90 degrees): turn it
                    // towards the contact point. LVGL rotation is in 0.1 degrees.
                    const float deg = atan2f(b.ny, b.nx) * 180.0f / (float) M_PI - 90.0f;
                    lv_image_set_src(b.base, dent_img);
                    lv_image_set_rotation(b.base, (int32_t) (deg * 10.0f));
                  } else if (b.dent == 0 && lv_image_get_src(b.base) != round_img) {
                    lv_image_set_src(b.base, round_img);
                    lv_image_set_rotation(b.base, 0);
                  }
                  if (b.dent > 0)
                    b.dent--;
                  const int px = (int) b.x - IMG / 2, py = (int) b.y - IMG / 2;
                  const float k = 2.0f * b.r / IMG;
                  lv_obj_set_pos(b.base, px, py);
                  lv_obj_set_pos(b.highlight, px + (int) (HL_DX * k), py + (int) (HL_DY * k));
                }
              },
              30, nullptr);

  # Screen saver: back to full brightness after dimming or switching off.
  # Back to normal after any screen power stage (see the interval below).
  - id: wake_screen
    mode: restart
    then:
      - script.stop: night_light_start
      - script.stop: night_light_stop
      - lambda: |-
          const int was = id(screen_state);
          id(screen_state) = 0;
          id(last_input_ms) = millis();
          id(keep_content) = false;
          if (id(night_light_on)) {
            id(night_light_on) = false;
            id(ui).hide_night_light();
            id(ks_night_light).publish_state(false);
          }
          const uint32_t transition = id(wake_transition_ms);
          id(wake_transition_ms) = 200;
          if (was & 1) {
            id(ui).stop_confetti();
            id(stop_loading_anim).execute();
            lv_obj_remove_flag(id(boot_mark), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(lbl_loading), LV_OBJ_FLAG_HIDDEN);
            id(ui).show_ui();
          }
          if (was & 4)
            id(unblank_screen).execute();
          if ((was & (2 | 8)) || !id(backlight).current_values.is_on()) {
            auto call = id(backlight).turn_on();
            call.set_brightness(id(awake_brightness));
            call.set_transition_length(transition);
            call.perform();
          }

  # Screensaver: the bouncing balls (without the brand mark and the text),
  # confetti or stars, as set in Home Assistant.
  - id: start_screensaver
    then:
      - if:
          condition:
            lambda: return id(ui).saver_type() == "confetti" || id(ui).saver_type() == "stars";
          then:
            - lambda: id(ui).start_confetti();
          else:
            - lambda: |-
                lv_obj_add_flag(id(boot_mark), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(lbl_loading), LV_OBJ_FLAG_HIDDEN);
            - lvgl.page.show: loading_page
            - script.execute: start_balls

  # Long press: acts as soon as the button has been held for the set time,
  # without waiting for the release.
  - id: long_press_timer
    mode: restart
    then:
      - delay: !lambda return (uint32_t) id(long_press_time).state;
      - lambda: |-
          if (id(knob_button).state && !id(swallow_click)) {
            id(long_press_fired) = true;
            id(last_input_ms) = millis();
            id(ui).long_press();
          }
      # Still held until three times the long-press time: straight back to
      # the child selector.
      - delay: !lambda return (uint32_t) (2 * id(long_press_time).state);
      - lambda: |-
          if (id(knob_button).state && id(long_press_fired)) {
            id(last_input_ms) = millis();
            id(ui).go_home();
          }

  # One UI step clockwise / anticlockwise.
  - id: knob_step_up
    then:
      - lambda: id(ui).rotate(1);
  - id: knob_step_down
    then:
      - lambda: id(ui).rotate(-1);

  # Night light: the screen goes dark, the white background with the moon
  # appears, then the backlight fades up.
  - id: night_light_start
    mode: restart
    then:
      - script.stop: night_light_stop
      - lambda: |-
          id(night_light_on) = true;
          id(absent_since_ms) = 0;
          id(screen_state) = 1 | 2 | 4 | 8;
          id(ui).stop_confetti();
          id(stop_loading_anim).execute();
          id(ks_night_light).publish_state(true);
          id(keep_content) = true;
      - if:
          condition:
            light.is_on: backlight
          then:
            - light.turn_off:
                id: backlight
                transition_length: 300ms
            - delay: 450ms
      - lambda: |-
          const auto &cfg = id(ui).sensor_settings();
          const int kelvin = id(night_req_kelvin) > 0 ? id(night_req_kelvin) : cfg.night_kelvin;
          id(ui).show_night_light(static_cast<uint16_t>(kelvin));
      - script.execute: unblank_screen
      # Let the white frame reach the panel before the light comes up.
      - delay: 150ms
      - lambda: |-
          const auto &cfg = id(ui).sensor_settings();
          const int pct = id(night_req_brightness) > 0 ? id(night_req_brightness) : cfg.night_brightness;
          id(keep_content) = false;
          auto call = id(backlight).turn_on();
          call.set_brightness(std::min(100, pct) / 100.0f);
          call.set_transition_length(500);
          call.perform();

  # The backlight fades out first, then the night light is cleared and the
  # screen stays off.
  - id: night_light_stop
    mode: single
    then:
      - script.stop: night_light_start
      - lambda: |-
          id(keep_content) = true;
          auto call = id(backlight).turn_off();
          call.set_transition_length(800);
          call.perform();
      # keep_content must outlast the transition (on_turn_off fires at its end).
      - delay: 1100ms
      - lambda: |-
          id(keep_content) = false;
          id(night_light_on) = false;
          id(night_req_brightness) = 0;
          id(night_req_kelvin) = 0;
          id(ui).hide_night_light();
          id(ks_night_light).publish_state(false);
      - script.execute: blank_screen

  # Reacts to the presence, distance and illuminance inputs (also called every
  # second): wakes the screen when someone comes near, shows the night light
  # in the dark, and clears it some time after presence ended.
  - id: sensor_check
    then:
      - lambda: |-
          const bool has_presence = id(ks_presence).has_state();
          const bool present = has_presence && id(ks_presence).state;
          const float dist = id(ks_distance).has_state() ? id(ks_distance).state : NAN;
          const bool has_distance = !std::isnan(dist);
          if (!id(ui).started()) {
            id(sensor_present_prev) = present;
            return;
          }
          const auto &cfg = id(ui).sensor_settings();
          const uint32_t now = millis();
          // Near: closer than the set distance (a little hysteresis); without a
          // distance input anyone present counts as near.
          bool &near = id(sensor_near);
          if (!present)
            near = false;
          else if (!has_distance)
            near = true;
          else
            near = dist <= cfg.near_cm + (near ? 15 : 0);
          if (near)
            id(last_active_ms) = now;
          const bool night = cfg.night_light && id(is_night);
          // In the dark, someone far away (or anyone, without a distance
          // input) gets the night light; the child UI needs them near.
          const bool wake = near && (!night || has_distance);
          const bool asleep = id(screen_state) != 0;
          const bool came = present && !id(sensor_present_prev);
          id(sensor_present_prev) = present;
          if (wake && !id(sensor_wake_prev) && (asleep || id(night_light_on)) &&
              (cfg.presence_wake || id(night_light_on))) {
            ESP_LOGI("kis_segito", "Woken by presence (%s)",
                     has_distance ? str_snprintf("%.0f cm", 16, dist).c_str() : "no distance input");
            id(wake_transition_ms) = 800;
            id(wake_screen).execute();
          } else if (came && night && asleep && !id(night_light_on)) {
            ESP_LOGI("kis_segito", "Presence in the dark: night light");
            id(night_light_start).execute();
          }
          id(sensor_wake_prev) = wake;
          // The night light ends some time after presence ended (without a
          // presence input only Home Assistant or the knob ends it).
          if (id(night_light_on) && has_presence && !id(night_light_stop).is_running()) {
            if (present) {
              id(absent_since_ms) = 0;
            } else if (id(absent_since_ms) == 0) {
              id(absent_since_ms) = std::max<uint32_t>(1, now);
            } else if (now - id(absent_since_ms) >= cfg.night_off_after * 1000) {
              ESP_LOGI("kis_segito", "Nobody there for %us: night light off", (unsigned) cfg.night_off_after);
              id(night_light_stop).execute();
            }
          }

  # Re-applies the translatable labels from ui_strings, and the brand mark
  # in the matching language.
  - id: refresh_texts
    then:
      - lvgl.label.update:
          id: lbl_loading
          text: !lambda return std::string(id(loading_text).data());
      - lambda: |-
          lv_image_set_src(id(boot_mark), id(boot_language_hu)
                                              ? id(ks_img_brand_mark_240)->get_lv_image_dsc()
                                              : id(ks_img_brand_mark_en_240)->get_lv_image_dsc());

# --- Input ----------------------------------------------------------------------

sensor:
  # The board profile's encoder (raw counts at the finest resolution).
  - id: !extend knob_encoder
    # Detent-aware stepping, count by count. A detent is counts_per_click raw
    # counts while the knob keeps turning one way, but the first detent after
    # a change of direction arrives one count earlier (the encoder's
    # hysteresis). `encoder_base` is the count of the detent the knob is in,
    # `encoder_dir` the direction of the last detent. The first click after a
    # reversal or a rest makes a UI step at once; after that every "Encoder
    # clicks per step" clicks do. Steps are queued; the screen handles them in
    # the UI's own loop.
    on_value:
      - lambda: |-
          const int pos = (int) x;
          const uint32_t now = millis();
          const int cpc = ${encoder_counts_per_click};
          int &ref = id(encoder_base);
          int &dir = id(encoder_dir);
          if (now - id(encoder_last_ms) > 1000) {
            id(encoder_clicks) = 0;  // after a rest the first click steps at once
            // At rest the knob sits in a detent: counts lost while the knob was
            // busy must not shift the detent grid.
            ref = id(encoder_last_pos);
          }
          id(encoder_last_ms) = now;
          int cur = id(encoder_last_pos);
          id(encoder_last_pos) = pos;
          id(last_input_ms) = now;
          // Input while the screen is dimmed or off only wakes it; the detent
          // of that turn is not a step. The detent tracking goes on, so the
          // next detent counts in either direction.
          if (id(screen_state) != 0 || !id(backlight).current_values.is_on()) {
            ESP_LOGI("kis_segito", "Woken by the knob");
            id(wake_screen).execute();
            id(encoder_swallow) = true;
          }
          const int per_step = std::max(1, (int) id(encoder_clicks_per_step).state);
          while (cur != pos) {
            const int u = pos > cur ? 1 : -1;
            cur += u;
            const int target = ref + u * (dir != 0 && u != dir ? std::max(1, cpc - 1) : cpc);
            if (u != dir && dir != 0 && cur == ref)
              continue;  // back in the detent it came from
            if (cur != target)
              continue;
            ref = cur;
            if (u != dir)
              id(encoder_clicks) = 0;  // a reversal: the first click steps at once
            dir = u;
            if (id(encoder_swallow)) {
              id(encoder_swallow) = false;  // the detent that woke the screen
              continue;
            }
            if (id(encoder_clicks) % per_step == 0) {
              if (u > 0)
                id(knob_step_up).execute();
              else
                id(knob_step_down).execute();
            }
            id(encoder_clicks)++;
          }
          if (${encoder_debug})
            ESP_LOGD("kis_segito", "Encoder raw %d: detent %d, direction %d", pos, ref, dir);
  # Sensor inputs. Route any sensor to them in your device config (see
  # docs/sensors.md), e.g. on_value -> sensor.template.publish; Home Assistant
  # can also forward one of its own entities.
  - platform: template
    id: ks_distance
    name: Distance
    icon: mdi:signal-distance-variant
    device_class: distance
    state_class: measurement
    unit_of_measurement: cm
    accuracy_decimals: 0
    update_interval: never
    on_value:
      - script.execute: sensor_check
  - platform: template
    id: ks_illuminance
    name: Illuminance
    device_class: illuminance
    state_class: measurement
    unit_of_measurement: lx
    accuracy_decimals: 1
    update_interval: never
    on_value:
      # Dark below the set level, light again above 1.5 times it (+1 lx).
      # While the night light shines, its own light must not end the night.
      - lambda: |-
          if (std::isnan(x) || id(night_light_on))
            return;
          const float limit = id(ui).sensor_settings().night_lux;
          if (id(is_night) && x > limit * 1.5f + 1.0f)
            id(is_night) = false;
          else if (!id(is_night) && x < limit)
            id(is_night) = true;
      - script.execute: sensor_check
  # Current backlight brightness (0 when off).
  - platform: template
    id: ks_screen_brightness
    name: Screen brightness
    icon: mdi:brightness-percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
    entity_category: diagnostic

number:
  # How long the button is held for a long press (back / reconnect).
  - platform: template
    id: long_press_time
    name: Long press time
    icon: mdi:gesture-tap-hold
    entity_category: config
    mode: box
    unit_of_measurement: ms
    min_value: 300
    max_value: 2000
    step: 50
    initial_value: 400
    optimistic: true
    restore_value: true
  # Encoder sensitivity, adjustable from Home Assistant and kept across reboots.
  - platform: template
    id: encoder_clicks_per_step
    name: Encoder clicks per step
    icon: mdi:knob
    entity_category: config
    mode: box
    min_value: 1
    max_value: 5
    step: 1
    initial_value: 1
    optimistic: true
    restore_value: true

select:
  # Animation level of the child UI, adjustable from Home Assistant.
  - platform: template
    id: animation_mode
    name: Animations
    icon: mdi:animation-play
    entity_category: config
    options: [full, reduced, "off"]
    initial_option: full
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(ui).set_animation_mode(std::string(x.c_str(), x.size()));

binary_sensor:
  # The board profile's push button.
  - id: !extend knob_button
    # Pressing while the screensaver runs or the screen is dimmed or off wakes
    # it at once (on the press, not the release); that press is not a click or
    # long press. Otherwise a release before the long press time is a click,
    # holding it is a long press (back one level; on the home screen it
    # connects to Home Assistant again).
    on_press:
      - lambda: |-
          id(last_input_ms) = millis();
          id(long_press_fired) = false;
          ESP_LOGD("kis_segito", "Button pressed (screen state %d)", id(screen_state));
          if (id(screen_state) != 0 || !id(backlight).current_values.is_on()) {
            ESP_LOGI("kis_segito", "Woken by the button");
            id(swallow_click) = true;
            id(wake_screen).execute();
            return;
          }
          id(swallow_click) = false;
          id(long_press_timer).execute();
    on_release:
      - script.stop: long_press_timer
      - lambda: |-
          id(last_input_ms) = millis();
          if (!id(swallow_click) && !id(long_press_fired))
            id(ui).click();
          id(swallow_click) = false;
          id(long_press_fired) = false;
  # Presence input (see the sensor inputs above).
  - platform: template
    id: ks_presence
    name: Presence
    device_class: occupancy
    on_state:
      - script.execute: sensor_check
  - platform: template
    id: ks_night_light
    name: Night light
    icon: mdi:weather-night
  - platform: template
    id: ks_screensaver
    name: Screensaver
    icon: mdi:sleep

button:
  # Manual restart from Home Assistant (separate from the restart that applies
  # a new background).
  - platform: template
    name: Restart
    icon: mdi:restart
    device_class: restart
    entity_category: config
    on_press:
      - logger.log:
          format: "Manual restart requested from Home Assistant"
          tag: kis_segito
      - delay: 100ms
      - lambda: App.safe_reboot();

text_sensor:
  # The child's actions on the knob (JSON with a unique id), for Home
  # Assistant: completed tasks, redeemed rewards. See docs/protocol.md.
  - platform: template
    id: knob_action
    name: Action
    icon: mdi:gesture-tap
    entity_category: diagnostic
  - platform: version
    name: ESPHome version
    entity_category: diagnostic

# --- UI -------------------------------------------------------------------------

font:
