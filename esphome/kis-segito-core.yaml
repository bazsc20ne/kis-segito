# However the backlight is switched off (Home Assistant, screen saver,
# automation), the screen content goes black; it comes back when it is on.
light:
  - id: !extend backlight
    on_turn_off:
      - if:
          condition:
            lambda: return !id(keep_content);
          then:
            - script.execute: blank_screen
    on_turn_on:
      - script.execute: unblank_screen
    on_state:
      - lambda: |-
          const auto &v = id(backlight).remote_values;
          id(ks_screen_brightness).publish_state(v.is_on() ? roundf(v.get_brightness() * 100.0f) : 0.0f);

# Screen power, with the times from Home Assistant (0 = never): screensaver,
# dimming, drawing off (black content, LVGL paused) and backlight off, each
# after its own idle time. Any knob input wakes everything (wake_screen).
interval:
  - interval: 1s
    then:
      - lambda: |-
          id(ui).set_idle_ms(millis() - id(last_input_ms));
          if (!id(ui).started())
            return;  // still loading
          const auto &cfg = id(ui).sensor_settings();
          const uint32_t now = millis();
          // With a presence input the stages count from when someone was last
          // near (or touched the knob), not only from the last input.
          uint32_t since = now - id(last_input_ms);
          if (cfg.presence_saver && id(ks_presence).has_state() && id(last_active_ms) != 0)
            since = std::min(since, now - id(last_active_ms));
          const uint32_t idle_s = since / 1000;
          const bool lit = id(backlight).current_values.is_on();
          id(ks_screensaver).publish_state((id(screen_state) & 1) && !id(night_light_on));
          // Brightness from the room light: log scale up to ~400 lx, eased.
          if (cfg.ambient && id(ks_illuminance).has_state() && !std::isnan(id(ks_illuminance).state)) {
            const float lux = std::max(0.0f, id(ks_illuminance).state);
            const float f = std::min(1.0f, log10f(1.0f + lux) / log10f(401.0f));
            const float target = (cfg.ambient_min + (cfg.ambient_max - cfg.ambient_min) * f) / 100.0f;
            float &level = id(ambient_level);
            level = level < 0 ? target : level + (target - level) * 0.25f;
            id(awake_brightness) = level;
            if (id(screen_state) == 0 && lit && !id(night_light_on) &&
                fabsf(level - id(backlight).remote_values.get_brightness()) > 0.03f) {
              auto call = id(backlight).turn_on();
              call.set_brightness(level);
              call.set_transition_length(1500);
              call.perform();
            }
          }
          auto due = [idle_s](uint32_t after) { return after > 0 && idle_s >= after; };
          int &st = id(screen_state);
          if (st == 0 && !lit)
            return;  // switched off from Home Assistant: leave it alone
          if (!(st & (2 | 8)) && lit && !(cfg.ambient && id(ambient_level) >= 0) &&
              (due(id(ui).dim_after()) || due(id(ui).off_after())))
            id(awake_brightness) = id(backlight).current_values.get_brightness();
          if (!(st & 1) && due(id(ui).saver_after())) {
            st |= 1;
            ESP_LOGI("kis_segito", "Screensaver after %us without input (set: %us)", (unsigned) idle_s,
                     (unsigned) id(ui).saver_after());
            id(start_screensaver).execute();
          }
          if (!(st & (2 | 8)) && due(id(ui).dim_after())) {
            st |= 2;
            auto call = id(backlight).turn_on();
            call.set_brightness(std::min(id(awake_brightness), id(ui).dim_level() / 100.0f));
            call.set_transition_length(1000);
            call.perform();
          }
          if (!(st & 4) && due(id(ui).blank_after())) {
            st |= 4;
            id(blank_screen).execute();
          }
          if (!(st & 8) && due(id(ui).off_after())) {
            st |= 8;
            auto call = id(backlight).turn_off();
            call.set_transition_length(1000);
            call.perform();
          }
      - script.execute: sensor_check
