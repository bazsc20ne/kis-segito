# SPDX-License-Identifier: AGPL-3.0-only
#
# Kis Segito - ESPHome package for the VIEWE UEDX48480021-MD80E knob
# (2.1" round 480x480 GC9503CV RGB panel, ESP32-S3-R8, rotary encoder + push button,
# no touch panel).
#
# Include it from a small device config, e.g.:
#
#   substitutions:
#     name: kis-segito
#     friendly_name: Kis Segito
#   packages:
#     kis_segito: github://bazsc20ne/kis-segito/esphome/kis-segito.yaml@v0.1.10
#   api:
#     encryption:
#       key: !secret kis_segito_api_key
#   wifi:
#     ssid: !secret wifi_ssid
#     password: !secret wifi_password
#
# See esphome/example.yaml. Secrets never belong in this repository.
#
# On-screen texts are not hard-coded: Home Assistant (the kis_segito integration)
# pushes the strings in the user's language through the `set_ui_strings` API action.
# Until it does, the screen only shows language-neutral symbols and numbers.

substitutions:
  name: kis-segito
  friendly_name: Kis Segito
  # Display tuning values are in hardware/board.yaml and can be overridden here.
  # Encoder counts per mechanical click at the finest resolution (4 counts per
  # quadrature cycle). The MD80E encoder makes half a cycle per click = 2.
  # How many clicks make one UI step is set at runtime from Home Assistant
  # ("Encoder clicks per step").
  encoder_counts_per_click: "2"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  name_add_mac_suffix: false
  project:
    name: bazsc20ne.kis-segito
    version: "0.1.10"

packages:
  board: !include hardware/board.yaml

logger:

api:
  actions:
    # Sets on-screen strings. keys[i] gets values[i]; unknown keys are stored too,
    # so newer integration versions can add texts without a firmware change.
    - action: set_ui_strings
      variables:
        language: string
        keys: string[]
        values: string[]
      then:
        - lambda: |-
            auto &strings = id(ui_strings);
            for (size_t i = 0; i < keys.size() && i < values.size(); i++) {
              strings[keys[i]] = values[i];
            }
            id(ui_language) = std::string(language.c_str(), language.size());
            ESP_LOGI("kis_segito", "Received %u UI strings (%s)", (unsigned) keys.size(),
                     id(ui_language).c_str());
            // Keep the loading text in flash, so after a power cut the boot screen
            // already speaks the last known Home Assistant language.
            auto it = strings.find("boot.loading");
            if (it != strings.end()) {
              std::array<char, 96> text{};
              size_t len = std::min(it->second.size(), text.size() - 1);
              // Do not cut a UTF-8 character in half.
              while (len > 0 && len < it->second.size() &&
                     (static_cast<uint8_t>(it->second[len]) & 0xC0) == 0x80) {
                len--;
              }
              memcpy(text.data(), it->second.data(), len);
              if (text != id(loading_text)) {
                id(loading_text) = text;
              }
            }
        - script.execute: refresh_texts
        - script.execute: stop_loading_anim
        - lvgl.page.show: test_page
  on_client_connected:
    - lvgl.label.update:
        id: lbl_api
        text_color: 0x4CAF50
  on_client_disconnected:
    - lvgl.label.update:
        id: lbl_api
        text_color: 0x616161

ota:
  - platform: esphome

wifi:
  ap: {}

captive_portal:

globals:
  # Encoder counts since the last UI step (negative = anticlockwise).
  - id: encoder_accum
    type: int
    initial_value: "0"
  # Translated UI strings, filled by Home Assistant (key -> text).
  - id: ui_strings
    type: std::map<std::string, std::string>
  - id: ui_language
    type: std::string
    initial_value: '""'
  - id: test_counter
    type: int
    initial_value: "0"
  # LVGL timer of the loading-screen animation; deleted when content arrives.
  - id: loading_anim
    type: lv_timer_t *
    initial_value: nullptr
  # Boot screen text in the last language received from Home Assistant
  # (NUL-terminated UTF-8). Empty until the first connection.
  - id: loading_text
    type: std::array<char, 96>
    restore_value: true

script:
  - id: stop_loading_anim
    then:
      - lambda: |-
          if (id(loading_anim) != nullptr) {
            lv_timer_delete(id(loading_anim));
            id(loading_anim) = nullptr;
          }

  # One UI step clockwise / anticlockwise.
  - id: knob_step_up
    then:
      - lambda: id(test_counter) += 1;
      - script.execute: show_counter
  - id: knob_step_down
    then:
      - lambda: id(test_counter) -= 1;
      - script.execute: show_counter

  - id: show_counter
    then:
      - lvgl.label.update:
          id: lbl_counter
          text: !lambda return std::to_string(id(test_counter));

  # Re-applies all translatable labels from ui_strings.
  - id: refresh_texts
    then:
      - lvgl.label.update:
          id: lbl_loading
          text: !lambda return std::string(id(loading_text).data());
      - lvgl.label.update:
          id: lbl_title
          text: !lambda |-
            auto it = id(ui_strings).find("test_screen.title");
            return it != id(ui_strings).end() ? it->second : std::string();
      - lvgl.label.update:
          id: lbl_hint
          text: !lambda |-
            auto it = id(ui_strings).find("test_screen.hint");
            return it != id(ui_strings).end() ? it->second : std::string();

  # Short visual feedback for a button press.
  - id: press_feedback
    mode: restart
    then:
      - lvgl.widget.update:
          id: ring
          border_color: 0x4CAF50
          border_width: 24
      - lvgl.label.update:
          id: lbl_feedback
          text: !lambda |-
            auto it = id(ui_strings).find("test_screen.pressed");
            return it != id(ui_strings).end() ? it->second : std::string();
      - delay: 600ms
      - lvgl.widget.update:
          id: ring
          border_color: 0x2196F3
          border_width: 8
      - lvgl.label.update:
          id: lbl_feedback
          text: ""

# --- Hardware -------------------------------------------------------------------

sensor:
  - platform: rotary_encoder
    id: knob_encoder
    name: Encoder
    icon: mdi:knob
    # External 4.7k pull-ups are on the board. A/B are swapped against the
    # vendor's BSP_ENCODER_A/B so that clockwise counts up.
    pin_a: GPIO5
    pin_b: GPIO6
    # Finest resolution; clicks are counted in software (see knob_step_*).
    resolution: 4
    # Raw counts are only useful for debugging; UI steps go to the scripts.
    internal: true
    on_clockwise:
      - lambda: |-
          if (id(encoder_accum) < 0) id(encoder_accum) = 0;
          id(encoder_accum) += 1;
          const int need = ${encoder_counts_per_click} * (int) id(encoder_clicks_per_step).state;
          if (id(encoder_accum) >= need) {
            id(encoder_accum) = 0;
            id(knob_step_up).execute();
          }
    on_anticlockwise:
      - lambda: |-
          if (id(encoder_accum) > 0) id(encoder_accum) = 0;
          id(encoder_accum) -= 1;
          const int need = ${encoder_counts_per_click} * (int) id(encoder_clicks_per_step).state;
          if (-id(encoder_accum) >= need) {
            id(encoder_accum) = 0;
            id(knob_step_down).execute();
          }
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
    entity_category: diagnostic

number:
  # Encoder sensitivity, adjustable from Home Assistant and kept across reboots.
  - platform: template
    id: encoder_clicks_per_step
    name: Encoder clicks per step
    icon: mdi:knob
    entity_category: config
    mode: box
    min_value: 1
    max_value: 5
    step: 1
    initial_value: 1
    optimistic: true
    restore_value: true

binary_sensor:
  - platform: gpio
    id: knob_button
    name: Button
    icon: mdi:gesture-tap-button
    # GPIO0 is a strapping pin; the board has an external pull-up.
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - script.execute: press_feedback

text_sensor:
  - platform: version
    name: ESPHome version
    entity_category: diagnostic

# --- UI -------------------------------------------------------------------------

# Text fonts with Latin, Greek and Cyrillic glyphs, so translations pushed from
# Home Assistant render without a firmware change. Symbols use the built-in
# LVGL Montserrat fonts.
font:
  - file: "gfonts://Nunito@700"
    id: font_text
    size: 26
    bpp: 4
    glyphsets: [GF_Latin_Core, GF_Greek_Core, GF_Cyrillic_Core]
  - file: "gfonts://Nunito@600"
    id: font_small
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Core, GF_Greek_Core, GF_Cyrillic_Core]

lvgl:
  displays:
    - knob_display
  buffer_size: 100%
  bg_color: 0x000000
  default_font: montserrat_24
  on_boot:
    - script.execute: refresh_texts
    # Loading animation: balls bounce off the round edge of the screen. A
    # 30 ms LVGL timer moves them; only the small ball areas are redrawn.
    - lambda: |-
        struct Ball {
          lv_obj_t *obj;
          float x, y, vx, vy;  // centre and speed in px per tick
          int r;
          int squash;  // ticks of squash left after a bounce
        };
        static Ball balls[] = {
            {id(ball_1), 240, 170, 4.6f, 2.1f, 22, 0},
            {id(ball_2), 190, 280, -3.2f, 3.9f, 18, 0},
            {id(ball_3), 300, 260, 2.4f, -4.4f, 15, 0},
            {id(ball_4), 250, 320, -4.1f, -2.7f, 20, 0},
        };
        id(loading_anim) = lv_timer_create(
            [](lv_timer_t *) {
              constexpr float CX = 240, CY = 240, EDGE = 234;
              for (auto &b : balls) {
                b.x += b.vx;
                b.y += b.vy;
                const float dx = b.x - CX, dy = b.y - CY;
                const float dist = sqrtf(dx * dx + dy * dy);
                const float max_dist = EDGE - b.r;
                if (dist > max_dist && dist > 0) {
                  const float nx = dx / dist, ny = dy / dist;
                  const float vn = b.vx * nx + b.vy * ny;
                  if (vn > 0) {  // moving outwards: reflect off the circle
                    b.vx -= 2 * vn * nx;
                    b.vy -= 2 * vn * ny;
                    b.squash = 4;
                  }
                  b.x = CX + nx * max_dist;
                  b.y = CY + ny * max_dist;
                }
                int w = 2 * b.r, h = 2 * b.r;
                if (b.squash > 0) {
                  const int s = b.squash;  // short, fading squash
                  w += s;
                  h -= s;
                  b.squash--;
                }
                lv_obj_set_size(b.obj, w, h);
                lv_obj_set_pos(b.obj, (int) (b.x - w / 2), (int) (b.y - h / 2));
              }
            },
            30, nullptr);
  pages:
    # Shown from boot until Home Assistant sends the content.
    # The project logo can go in the middle later, with the balls around it.
    - id: loading_page
      bg_color: 0x000000
      widgets:
        # Bouncing balls, moved by the loading_anim timer (see lvgl on_boot).
        - obj:
            id: ball_1
            x: 220
            y: 220
            width: 44
            height: 44
            radius: 22
            bg_color: 0xFFC94A
            bg_opa: COVER
            border_width: 0
            scrollable: false
        - obj:
            id: ball_2
            x: 220
            y: 220
            width: 36
            height: 36
            radius: 18
            bg_color: 0xFF8FB1
            bg_opa: COVER
            border_width: 0
            scrollable: false
        - obj:
            id: ball_3
            x: 220
            y: 220
            width: 30
            height: 30
            radius: 15
            bg_color: 0x6CB8FF
            bg_opa: COVER
            border_width: 0
            scrollable: false
        - obj:
            id: ball_4
            x: 220
            y: 220
            width: 40
            height: 40
            radius: 20
            bg_color: 0x6BCB77
            bg_opa: COVER
            border_width: 0
            scrollable: false
        - label:
            id: lbl_loading
            align: CENTER
            y: 0
            text_font: font_text
            text_color: 0xFFFFFF
            text: ""
    - id: test_page
      bg_color: 0x000000
      widgets:
        - obj:
            id: ring
            align: CENTER
            width: 460
            height: 460
            radius: 230
            bg_opa: TRANSP
            border_color: 0x2196F3
            border_width: 8
        - label:
            id: lbl_title
            align: TOP_MID
            y: 70
            text_font: font_text
            text_color: 0xFFFFFF
            text: ""
        - label:
            id: lbl_counter
            align: CENTER
            text_font: montserrat_48
            text_color: 0xFFFFFF
            text: "0"
        - label:
            id: lbl_feedback
            align: CENTER
            y: 70
            text_font: font_text
            text_color: 0x4CAF50
            text: ""
        - label:
            id: lbl_hint
            align: BOTTOM_MID
            y: -70
            text_color: 0x9E9E9E
            text_font: font_small
            text: ""
        - label:
            id: lbl_api
            align: BOTTOM_MID
            y: -30
            text_color: 0x616161
            text: !lambda return std::string(LV_SYMBOL_HOME);
