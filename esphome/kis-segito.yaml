# SPDX-License-Identifier: AGPL-3.0-only
#
# Kis Segito - ESPHome package for the VIEWE UEDX48480021-MD80E knob
# (2.1" round 480x480 ST7701S RGB panel, ESP32-S3-R8, rotary encoder + push button,
# no touch panel).
#
# Include it from a small device config, e.g.:
#
#   substitutions:
#     name: kis-segito
#     friendly_name: Kis Segito
#   packages:
#     kis_segito: github://bazsc20ne/kis-segito/esphome/kis-segito.yaml@v0.1.0
#   api:
#     encryption:
#       key: !secret kis_segito_api_key
#   wifi:
#     ssid: !secret wifi_ssid
#     password: !secret wifi_password
#
# See esphome/example.yaml. Secrets never belong in this repository.
#
# On-screen texts are not hard-coded: Home Assistant (the kis_segito integration)
# pushes the strings in the user's language through the `set_ui_strings` API action.
# Until it does, the screen only shows language-neutral symbols and numbers.

substitutions:
  name: kis-segito
  friendly_name: Kis Segito
  # Panel tuning knobs, in case a panel batch needs different settings.
  display_color_order: RGB
  display_invert_colors: "false"
  # Encoder steps per detent (1, 2 or 4).
  encoder_resolution: "1"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  name_add_mac_suffix: false
  project:
    name: bazsc20ne.kis-segito
    version: "0.1.0"

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  actions:
    # Sets on-screen strings. keys[i] gets values[i]; unknown keys are stored too,
    # so newer integration versions can add texts without a firmware change.
    - action: set_ui_strings
      variables:
        language: string
        keys: string[]
        values: string[]
      then:
        - lambda: |-
            auto &strings = id(ui_strings);
            for (size_t i = 0; i < keys.size() && i < values.size(); i++) {
              strings[keys[i]] = values[i];
            }
            id(ui_language) = std::string(language.c_str(), language.size());
            ESP_LOGI("kis_segito", "Received %u UI strings (%s)", (unsigned) keys.size(),
                     id(ui_language).c_str());
        - script.execute: refresh_texts
  on_client_connected:
    - lvgl.label.update:
        id: lbl_api
        text_color: 0x4CAF50
  on_client_disconnected:
    - lvgl.label.update:
        id: lbl_api
        text_color: 0x616161

ota:
  - platform: esphome

wifi:
  ap: {}

captive_portal:

improv_serial:

globals:
  # Translated UI strings, filled by Home Assistant (key -> text).
  - id: ui_strings
    type: std::map<std::string, std::string>
  - id: ui_language
    type: std::string
    initial_value: '""'
  - id: test_counter
    type: int
    initial_value: "0"

script:
  - id: show_counter
    then:
      - lvgl.label.update:
          id: lbl_counter
          text: !lambda return std::to_string(id(test_counter));

  # Re-applies all translatable labels from ui_strings.
  - id: refresh_texts
    then:
      - lvgl.label.update:
          id: lbl_title
          text: !lambda |-
            auto it = id(ui_strings).find("test_screen.title");
            return it != id(ui_strings).end() ? it->second : std::string();
      - lvgl.label.update:
          id: lbl_hint
          text: !lambda |-
            auto it = id(ui_strings).find("test_screen.hint");
            return it != id(ui_strings).end() ? it->second : std::string();

  # Short visual feedback for a button press.
  - id: press_feedback
    mode: restart
    then:
      - lvgl.widget.update:
          id: ring
          border_color: 0x4CAF50
          border_width: 24
      - lvgl.label.update:
          id: lbl_feedback
          text: !lambda |-
            auto it = id(ui_strings).find("test_screen.pressed");
            return it != id(ui_strings).end() ? it->second : std::string();
      - delay: 600ms
      - lvgl.widget.update:
          id: ring
          border_color: 0x2196F3
          border_width: 8
      - lvgl.label.update:
          id: lbl_feedback
          text: ""

# --- Hardware -------------------------------------------------------------------

# 3-wire SPI used only to send the ST7701S init sequence. SCK/SDA share pins
# with RGB data lines B6/B5, so a software SPI bus is used.
spi:
  id: lcd_spi
  interface: software
  clk_pin:
    number: GPIO13
    allow_other_uses: true
  mosi_pin:
    number: GPIO12
    allow_other_uses: true

display:
  - platform: mipi_rgb
    id: knob_display
    # Built-in ESPHome model; the panel, pinout and init sequence are the same
    # on the touch (MD80ET) and non-touch (MD80E) variants.
    model: UEDX48480021-MD80ET
    spi_id: lcd_spi
    color_order: ${display_color_order}
    invert_colors: ${display_invert_colors}
    update_interval: never
    auto_clear_enabled: false

# Backlight: P-channel MOSFET, GPIO7 low = on.
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO7
    inverted: true
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    icon: mdi:brightness-6
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

sensor:
  - platform: rotary_encoder
    id: knob_encoder
    name: Encoder
    icon: mdi:knob
    # External 4.7k pull-ups are on the board.
    pin_a: GPIO6
    pin_b: GPIO5
    resolution: ${encoder_resolution}
    on_clockwise:
      - lambda: id(test_counter) += 1;
      - script.execute: show_counter
    on_anticlockwise:
      - lambda: id(test_counter) -= 1;
      - script.execute: show_counter
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: gpio
    id: knob_button
    name: Button
    icon: mdi:gesture-tap-button
    # GPIO0 is a strapping pin; the board has an external pull-up.
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - script.execute: press_feedback

text_sensor:
  - platform: version
    name: ESPHome version
    entity_category: diagnostic

# --- UI -------------------------------------------------------------------------

# Text fonts with Latin, Greek and Cyrillic glyphs, so translations pushed from
# Home Assistant render without a firmware change. Symbols use the built-in
# LVGL Montserrat fonts.
font:
  - file: "gfonts://Nunito@700"
    id: font_text
    size: 26
    bpp: 4
    glyphsets: [GF_Latin_Core, GF_Greek_Core, GF_Cyrillic_Core]
  - file: "gfonts://Nunito@600"
    id: font_small
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Core, GF_Greek_Core, GF_Cyrillic_Core]

lvgl:
  displays:
    - knob_display
  buffer_size: 100%
  bg_color: 0x000000
  default_font: montserrat_24
  on_boot:
    - script.execute: refresh_texts
  pages:
    - id: test_page
      bg_color: 0x000000
      widgets:
        - obj:
            id: ring
            align: CENTER
            width: 460
            height: 460
            radius: 230
            bg_opa: TRANSP
            border_color: 0x2196F3
            border_width: 8
        - label:
            id: lbl_title
            align: TOP_MID
            y: 70
            text_font: font_text
            text_color: 0xFFFFFF
            text: ""
        - label:
            id: lbl_counter
            align: CENTER
            text_font: montserrat_48
            text_color: 0xFFFFFF
            text: "0"
        - label:
            id: lbl_feedback
            align: CENTER
            y: 70
            text_font: font_text
            text_color: 0x4CAF50
            text: ""
        - label:
            id: lbl_hint
            align: BOTTOM_MID
            y: -70
            text_color: 0x9E9E9E
            text_font: font_small
            text: ""
        - label:
            id: lbl_api
            align: BOTTOM_MID
            y: -30
            text_color: 0x616161
            text: !lambda return std::string(LV_SYMBOL_HOME);
