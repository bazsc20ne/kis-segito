# SPDX-License-Identifier: AGPL-3.0-only
#
# Kis Segito - ESPHome package for the VIEWE UEDX48480021-MD80E knob
# (2.1" round 480x480 GC9503CV RGB panel, ESP32-S3-R8, rotary encoder + push button,
# no touch panel).
#
# Include it from a small device config, e.g.:
#
#   substitutions:
#     name: kis-segito
#     friendly_name: Kis Segito
#   packages:
#     kis_segito: github://bazsc20ne/kis-segito/esphome/kis-segito.yaml@v0.2.0
#   api:
#     encryption:
#       key: !secret kis_segito_api_key
#   wifi:
#     ssid: !secret wifi_ssid
#     password: !secret wifi_password
#
# See esphome/example.yaml. Secrets never belong in this repository.
#
# The child UI is drawn by the kis_segito_ui external component (esphome/components)
# with the icons from assets/device. On-screen texts are not hard-coded: Home
# Assistant (the kis_segito integration) pushes them in the user's language through
# the `set_ui_strings` API action; the UI starts once they arrive.
#
# Note: the knob button is on GPIO0, a strapping pin. Holding it down while the
# knob powers up or restarts puts the ESP32-S3 into download (flashing) mode.

substitutions:
  name: kis-segito
  friendly_name: Kis Segito
  # Where the UI component and its images come from. They must match the
  # version of this package; CI and local builds point them at the repository.
  kis_segito_components: github://bazsc20ne/kis-segito@v0.2.0
  kis_segito_assets: https://raw.githubusercontent.com/bazsc20ne/kis-segito/v0.2.0/assets/device
  # Display tuning values are in hardware/board.yaml and can be overridden here.
  # Encoder counts per mechanical click at the finest resolution (4 counts per
  # quadrature cycle). The MD80E encoder makes half a cycle per click = 2.
  # How many clicks make one UI step is set at runtime from Home Assistant
  # ("Encoder clicks per step").
  encoder_counts_per_click: "2"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  name_add_mac_suffix: false
  project:
    name: bazsc20ne.kis-segito
    version: "0.2.0"

external_components:
  - source: ${kis_segito_components}
    components: [kis_segito_ui]

packages:
  board: !include hardware/board.yaml
  ui_images: !include ui-images.yaml

logger:

api:
  actions:
    # Sets on-screen strings. keys[i] gets values[i]; unknown keys are stored too,
    # so newer integration versions can add texts without a firmware change.
    - action: set_ui_strings
      variables:
        language: string
        keys: string[]
        values: string[]
      then:
        - lambda: |-
            auto &strings = id(ui_strings);
            for (size_t i = 0; i < keys.size() && i < values.size(); i++) {
              strings[keys[i]] = values[i];
            }
            id(ui_language) = std::string(language.c_str(), language.size());
            ESP_LOGI("kis_segito", "Received %u UI strings (%s)", (unsigned) keys.size(),
                     id(ui_language).c_str());
            // Keep the loading text in flash, so after a power cut the boot screen
            // already speaks the last known Home Assistant language.
            auto it = strings.find("boot.loading");
            if (it != strings.end()) {
              std::array<char, 96> text{};
              size_t len = std::min(it->second.size(), text.size() - 1);
              // Do not cut a UTF-8 character in half.
              while (len > 0 && len < it->second.size() &&
                     (static_cast<uint8_t>(it->second[len]) & 0xC0) == 0x80) {
                len--;
              }
              memcpy(text.data(), it->second.data(), len);
              if (text != id(loading_text)) {
                id(loading_text) = text;
              }
            }
        - script.execute: refresh_texts
        - script.execute: stop_loading_anim
        - lambda: |-
            const auto mode = id(animation_mode).current_option();
            id(ui).set_animation_mode(std::string(mode.c_str(), mode.size()));
            id(ui).start();
  on_client_connected:
    - lambda: id(ui).set_connected(true);
  on_client_disconnected:
    - lambda: id(ui).set_connected(false);

ota:
  - platform: esphome

wifi:
  ap: {}

captive_portal:

globals:
  # Encoder counts since the last UI step (negative = anticlockwise).
  - id: encoder_accum
    type: int
    initial_value: "0"
  # Translated UI strings, filled by Home Assistant (key -> text).
  - id: ui_strings
    type: std::map<std::string, std::string>
  - id: ui_language
    type: std::string
    initial_value: '""'
  # LVGL timer of the loading-screen animation; deleted when content arrives.
  - id: loading_anim
    type: lv_timer_t *
    initial_value: nullptr
  # Boot screen text in the last language received from Home Assistant
  # (NUL-terminated UTF-8). Empty until the first connection.
  - id: loading_text
    type: std::array<char, 96>
    restore_value: true

script:
  - id: stop_loading_anim
    then:
      - lambda: |-
          if (id(loading_anim) != nullptr) {
            lv_timer_delete(id(loading_anim));
            id(loading_anim) = nullptr;
          }

  # One UI step clockwise / anticlockwise.
  - id: knob_step_up
    then:
      - lambda: id(ui).rotate(1);
  - id: knob_step_down
    then:
      - lambda: id(ui).rotate(-1);

  # Re-applies the translatable labels from ui_strings.
  - id: refresh_texts
    then:
      - lvgl.label.update:
          id: lbl_loading
          text: !lambda return std::string(id(loading_text).data());

# --- Hardware -------------------------------------------------------------------

sensor:
  - platform: rotary_encoder
    id: knob_encoder
    name: Encoder
    icon: mdi:knob
    # External 4.7k pull-ups are on the board. A/B are swapped against the
    # vendor's BSP_ENCODER_A/B so that clockwise counts up.
    pin_a: GPIO5
    pin_b: GPIO6
    # Finest resolution; clicks are counted in software (see knob_step_*).
    resolution: 4
    # Raw counts are only useful for debugging; UI steps go to the scripts.
    internal: true
    on_clockwise:
      - lambda: |-
          if (id(encoder_accum) < 0) id(encoder_accum) = 0;
          id(encoder_accum) += 1;
          const int need = ${encoder_counts_per_click} * (int) id(encoder_clicks_per_step).state;
          if (id(encoder_accum) >= need) {
            id(encoder_accum) = 0;
            id(knob_step_up).execute();
          }
    on_anticlockwise:
      - lambda: |-
          if (id(encoder_accum) > 0) id(encoder_accum) = 0;
          id(encoder_accum) -= 1;
          const int need = ${encoder_counts_per_click} * (int) id(encoder_clicks_per_step).state;
          if (-id(encoder_accum) >= need) {
            id(encoder_accum) = 0;
            id(knob_step_down).execute();
          }
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
    entity_category: diagnostic

number:
  # Encoder sensitivity, adjustable from Home Assistant and kept across reboots.
  - platform: template
    id: encoder_clicks_per_step
    name: Encoder clicks per step
    icon: mdi:knob
    entity_category: config
    mode: box
    min_value: 1
    max_value: 5
    step: 1
    initial_value: 1
    optimistic: true
    restore_value: true

select:
  # Animation level of the child UI, adjustable from Home Assistant.
  - platform: template
    id: animation_mode
    name: Animations
    icon: mdi:animation-play
    entity_category: config
    options: [full, reduced, "off"]
    initial_option: full
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(ui).set_animation_mode(std::string(x.c_str(), x.size()));

binary_sensor:
  - platform: gpio
    id: knob_button
    name: Button
    icon: mdi:gesture-tap-button
    # GPIO0 is a strapping pin (see the note at the top); external pull-up.
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    # Short press = select / confirm; long press = back one level.
    on_click:
      - min_length: 10ms
        max_length: 650ms
        then:
          - lambda: id(ui).click();
    on_multi_click:
      - timing:
          - ON for at least 700ms
        then:
          - lambda: id(ui).long_press();

text_sensor:
  - platform: version
    name: ESPHome version
    entity_category: diagnostic

# --- UI -------------------------------------------------------------------------

font:
  # Text font with Latin, Greek and Cyrillic glyphs, so translations pushed from
  # Home Assistant render without a firmware change.
  - file: "gfonts://Nunito@700"
    id: font_text
    size: 26
    bpp: 4
    glyphsets: [GF_Latin_Core, GF_Greek_Core, GF_Cyrillic_Core]
  # Numbers (token counts, prices).
  - file: "gfonts://Baloo 2@800"
    id: font_number
    size: 34
    bpp: 4
    glyphs: "0123456789+-/"

lvgl:
  displays:
    - knob_display
  buffer_size: 100%
  bg_color: 0x000000
  default_font: montserrat_24
  on_boot:
    - script.execute: refresh_texts
    # Loading animation: layered balls (recoloured base + fixed highlight)
    # bounce off the round edge and off each other. On impact the base is
    # squashed along the collision normal (rotation + X/Y scale); the
    # highlight never rotates or squashes. A 30 ms LVGL timer moves them.
    - lambda: |-
        struct Ball {
          lv_obj_t *base;
          lv_obj_t *highlight;
          float x, y, vx, vy;  // centre and speed in px per tick
          int r;
          int squash;      // ticks of squash left after a bounce
          float nx, ny;    // last collision normal
        };
        static Ball balls[] = {
            {id(ball_1), id(ball_1_hl), 240, 170, 4.6f, 2.1f, 22, 0, 1, 0},
            {id(ball_2), id(ball_2_hl), 190, 280, -3.2f, 3.9f, 18, 0, 1, 0},
            {id(ball_3), id(ball_3_hl), 300, 260, 2.4f, -4.4f, 15, 0, 1, 0},
            {id(ball_4), id(ball_4_hl), 250, 320, -4.1f, -2.7f, 20, 0, 1, 0},
            {id(ball_5), id(ball_5_hl), 160, 200, 3.7f, 3.3f, 17, 0, 1, 0},
        };
        constexpr int IMG = 48;  // source image size of both layers
        for (auto &b : balls) {
          const int scale = 2 * b.r * 256 / IMG;
          lv_image_set_scale(b.base, scale);
          lv_image_set_scale(b.highlight, scale);
        }
        id(loading_anim) = lv_timer_create(
            [](lv_timer_t *) {
              constexpr float CX = 240, CY = 240, EDGE = 234;
              constexpr int IMG = 48;
              constexpr size_t N = sizeof(balls) / sizeof(balls[0]);
              // Ball-to-ball bounces (elastic, mass ~ area).
              for (size_t i = 0; i < N; i++) {
                for (size_t j = i + 1; j < N; j++) {
                  Ball &a = balls[i], &c = balls[j];
                  const float dx = c.x - a.x, dy = c.y - a.y;
                  const float dist = sqrtf(dx * dx + dy * dy);
                  const float min_dist = a.r + c.r;
                  if (dist >= min_dist || dist <= 0)
                    continue;
                  const float nx = dx / dist, ny = dy / dist;
                  const float rel = (a.vx - c.vx) * nx + (a.vy - c.vy) * ny;
                  if (rel > 0) {  // approaching each other
                    const float ma = a.r * a.r, mc = c.r * c.r;
                    const float imp = 2 * rel / (ma + mc);
                    a.vx -= imp * mc * nx;
                    a.vy -= imp * mc * ny;
                    c.vx += imp * ma * nx;
                    c.vy += imp * ma * ny;
                    a.squash = c.squash = 3;
                    a.nx = c.nx = nx;
                    a.ny = c.ny = ny;
                  }
                  const float push = (min_dist - dist) / 2;  // separate them
                  a.x -= nx * push;
                  a.y -= ny * push;
                  c.x += nx * push;
                  c.y += ny * push;
                }
              }
              for (auto &b : balls) {
                b.x += b.vx;
                b.y += b.vy;
                const float dx = b.x - CX, dy = b.y - CY;
                const float dist = sqrtf(dx * dx + dy * dy);
                const float max_dist = EDGE - b.r;
                if (dist > max_dist && dist > 0) {
                  const float nx = dx / dist, ny = dy / dist;
                  const float vn = b.vx * nx + b.vy * ny;
                  if (vn > 0) {  // moving outwards: reflect off the circle
                    b.vx -= 2 * vn * nx;
                    b.vy -= 2 * vn * ny;
                    b.squash = 4;
                    b.nx = nx;
                    b.ny = ny;
                  }
                  b.x = CX + nx * max_dist;
                  b.y = CY + ny * max_dist;
                }
                const int scale = 2 * b.r * 256 / IMG;
                if (b.squash > 0) {
                  // Squash along the collision normal: rotate the image's X axis
                  // onto the normal, then shrink X and stretch Y.
                  const float k = b.squash / 4.0f;
                  const int angle = (int) (atan2f(b.ny, b.nx) * 1800.0f / (float) M_PI);
                  lv_image_set_rotation(b.base, angle);
                  lv_image_set_scale_x(b.base, (uint32_t) (scale * (1.0f - 0.22f * k)));
                  lv_image_set_scale_y(b.base, (uint32_t) (scale * (1.0f + 0.12f * k)));
                  b.squash--;
                } else {
                  lv_image_set_rotation(b.base, 0);
                  lv_image_set_scale(b.base, scale);
                }
                const int px = (int) b.x - IMG / 2, py = (int) b.y - IMG / 2;
                lv_obj_set_pos(b.base, px, py);
                lv_obj_set_pos(b.highlight, px, py);
              }
            },
            30, nullptr);
  pages:
    # Shown from boot until Home Assistant sends the content.
    # The project logo can go in the middle later, with the balls around it.
    - id: loading_page
      bg_color: 0x000000
      widgets:
        - image:
            id: ball_1
            src: ks_img_ball_base_48
            x: 216
            y: 216
            image_recolor: 0xFFC94A
            image_recolor_opa: 70%
        - image:
            id: ball_1_hl
            src: ks_img_ball_highlight_48
            x: 216
            y: 216
        - image:
            id: ball_2
            src: ks_img_ball_base_48
            x: 216
            y: 216
            image_recolor: 0xFF8FB1
            image_recolor_opa: 70%
        - image:
            id: ball_2_hl
            src: ks_img_ball_highlight_48
            x: 216
            y: 216
        - image:
            id: ball_3
            src: ks_img_ball_base_48
            x: 216
            y: 216
            image_recolor: 0x6CB8FF
            image_recolor_opa: 70%
        - image:
            id: ball_3_hl
            src: ks_img_ball_highlight_48
            x: 216
            y: 216
        - image:
            id: ball_4
            src: ks_img_ball_base_48
            x: 216
            y: 216
            image_recolor: 0x6BCB77
            image_recolor_opa: 70%
        - image:
            id: ball_4_hl
            src: ks_img_ball_highlight_48
            x: 216
            y: 216
        - image:
            id: ball_5
            src: ks_img_ball_base_48
            x: 216
            y: 216
            image_recolor: 0xFF9F43
            image_recolor_opa: 70%
        - image:
            id: ball_5_hl
            src: ks_img_ball_highlight_48
            x: 216
            y: 216
        - label:
            id: lbl_loading
            align: CENTER
            y: 0
            text_font: font_text
            text_color: 0xFFFFFF
            text: ""
