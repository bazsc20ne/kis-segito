# SPDX-License-Identifier: AGPL-3.0-only
# Full firmware build whenever the ESPHome files change.
name: ESPHome build

on:
  push:
    paths:
      - "esphome/**"
      - "assets/**"
      - ".github/workflows/esphome.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: esphome/build-action@76cd6898550762b189215bbe6e50e29080fd2c33 # v7.0.0
        id: build
        with:
          yaml-file: esphome/kis-segito-factory.yaml
          version: ${{ vars.ESPHOME_VERSION || '2026.9.1' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware
          path: ${{ steps.build.outputs.name }}
          retention-days: 7

  build-display-test:
    name: Compile display test firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use placeholder secrets
        run: cp esphome/secrets.example.yaml esphome/secrets.yaml
      - uses: esphome/build-action@76cd6898550762b189215bbe6e50e29080fd2c33 # v7.0.0
        with:
          yaml-file: esphome/display-test.yaml
          version: ${{ vars.ESPHOME_VERSION || '2026.9.1' }}

  build-diagnostics:
    name: Compile diagnostic packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: esphome/build-action@76cd6898550762b189215bbe6e50e29080fd2c33 # v7.0.0
        with:
          yaml-file: esphome/tests/diagnostics.yaml
          version: ${{ vars.ESPHOME_VERSION || '2026.9.1' }}
