# SPDX-License-Identifier: AGPL-3.0-only
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master, 2026-10-08

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-10-08
        with:
          category: integration
          # brands: until the icon is in home-assistant/brands.
          # topics: repository topics are set by the owner when the repo goes
          # to the HACS default list.
          ignore: "brands topics"

  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - name: Install the matching Home Assistant frontend
        run: |
          pip install "$(python - <<'PY'
          import json, pathlib, homeassistant.components.frontend as f
          manifest = json.loads((pathlib.Path(f.__file__).parent / "manifest.json").read_text())
          print(next(r for r in manifest["requirements"] if r.startswith("home-assistant-frontend")))
          PY
          )"
      - run: pytest

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 scripts/check_versions.py

  esphome-config:
    name: ESPHome config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install "esphome==${{ vars.ESPHOME_VERSION || '2026.9.1' }}"
      - name: Validate configs
        working-directory: esphome
        run: |
          cp secrets.example.yaml secrets.yaml
          esphome config kis-segito-factory.yaml
          esphome config display-test.yaml
          esphome config tests/diagnostics.yaml
