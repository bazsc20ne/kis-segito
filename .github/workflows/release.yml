# SPDX-License-Identifier: AGPL-3.0-only
# Publishes a release: checks versions, builds the firmware and creates the GitHub
# Release (with the notes of that version from CHANGELOG.md).
#
# Triggers:
# - pushing a vX.Y.Z tag, or
# - running it manually with a version; the vX.Y.Z tag is then created on the
#   commit the workflow runs on.
#
# With a RELEASE_TOKEN repository secret (a fine-grained personal access token for
# this repository with "Contents: read and write") the release and the tag are
# created as the token's owner; without it, as github-actions. A tag created with
# that token triggers this workflow again: that run sees the release and stops.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (tag v0.1.0 is created)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  check:
    name: Check for an existing release
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  firmware:
    name: Build firmware
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 scripts/check_versions.py "${TAG}"
      - uses: esphome/build-action@76cd6898550762b189215bbe6e50e29080fd2c33 # v7.0.0
        id: build
        with:
          yaml-file: esphome/kis-segito-factory.yaml
          version: ${{ vars.ESPHOME_VERSION || '2026.9.1' }}
      - name: Rename firmware files
        run: |
          mkdir dist
          cp "${{ steps.build.outputs.name }}/${{ steps.build.outputs.name }}.factory.bin" "dist/kis-segito-${TAG}.factory.bin"
          cp "${{ steps.build.outputs.name }}/${{ steps.build.outputs.name }}.ota.bin" "dist/kis-segito-${TAG}.ota.bin"
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware
          path: dist

  release:
    name: Publish release
    needs: firmware
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: firmware
          path: dist
      - name: Extract release notes
        run: python3 scripts/release_notes.py "${TAG}" > release-notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          body_path: release-notes.md
          files: dist/*
