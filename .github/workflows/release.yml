# SPDX-License-Identifier: AGPL-3.0-only
# Publishes a release: checks versions, builds the firmware and creates the GitHub
# Release (with the notes of that version from CHANGELOG.md).
#
# Triggers:
# - pushing a vX.Y.Z tag, or
# - running it manually with a version; the vX.Y.Z tag is then created on the
#   commit the workflow runs on.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (tag v0.1.0 is created)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_versions.py "${TAG}"
      - uses: esphome/build-action@v7.0.0
        id: build
        with:
          yaml-file: esphome/kis-segito-factory.yaml
          version: ${{ vars.ESPHOME_VERSION || '2026.9.1' }}
      - name: Rename firmware files
        run: |
          mkdir dist
          cp "${{ steps.build.outputs.name }}/${{ steps.build.outputs.name }}.factory.bin" "dist/kis-segito-${TAG}.factory.bin"
          cp "${{ steps.build.outputs.name }}/${{ steps.build.outputs.name }}.ota.bin" "dist/kis-segito-${TAG}.ota.bin"
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist

  release:
    name: Publish release
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - name: Extract release notes
        run: python3 scripts/release_notes.py "${TAG}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          body_path: release-notes.md
          files: dist/*
